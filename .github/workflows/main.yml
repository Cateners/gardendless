name: Gardendless Auto Build

on:
  schedule:
    - cron: '0 0 * * *'  # 每天UTC 0点运行
  workflow_dispatch:      # 允许手动触发

jobs:
  process-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Gardendless
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          path: gardendless

      - name: Get Test_pvz2 Latest Commit
        id: get-test-pvz2-commit
        run: |
          # 获取提交SHA
          COMMIT_SHA=$(curl -s https://api.github.com/repos/Gzh0821/pvzge_web/commits/master | jq -r '.sha')
          
          # 检查是否成功获取
          if [ -z "$COMMIT_SHA" ] || [ "$COMMIT_SHA" == "null" ]; then
            echo "❌ 错误：无法获取最新的提交哈希"
            echo "请检查："
            echo "1. 仓库地址是否正确：Gzh0821/pvzge_web"
            echo "2. master分支是否存在"
            echo "3. GitHub API访问是否正常"
            exit 1  # 非零退出码表示失败
          fi
          
          echo "✅ 成功获取提交哈希: ${COMMIT_SHA:0:8}..."
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT

      - name: Check Last Processed Commit
        id: check-commit
        run: |
          if [ -f "gardendless/assets/last_commit.txt" ]; then
            LAST_COMMIT=$(cat gardendless/assets/last_commit.txt)
            if [ "$LAST_COMMIT" == "${{ steps.get-test-pvz2-commit.outputs.commit_sha }}" ]; then
              echo "No new commit, exiting."
              exit 1
            fi
          fi
          echo "Proceeding with new commit."

      - name: Clone Test_pvz2
        uses: actions/checkout@v4
        with:
          repository: Gzh0821/pvzge_web
          path: pvzge_web

      - name: Insert touchPatch.js into index.html
        run: |
          cp gardendless/touchPatch.js pvzge_web/docs/
          sed -i '/<\/body>/i <script src="touchPatch.js"><\/script>' pvzge_web/docs/index.html

      - name: Create game.zip
        run: |
          cd pvzge_web/docs
          zip -r ../../game.zip ./*

      - name: Update Assets in Gardendless
        run: |
          mkdir -p gardendless/assets
          mv game.zip gardendless/assets/game.zip

      - name: Extract Version/Commit
        id: extract-version
        run: |
          cd pvzge_web
          COMMIT_MSG=$(git log -1 --pretty=%B)
          VERSION=$(echo "$COMMIT_MSG" | grep -oP 'version \K\d+\.\d+\.\d+' || true)
          
          if [ -z "$VERSION" ]; then
            VERSION=$(git rev-parse --short HEAD)
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Modify main.dart
        run: |
          REPLACE="${{ steps.extract-version.outputs.version }}"
          sed -i "s/complete\.txt/${REPLACE}.txt/g" gardendless/lib/main.dart

      - name: Update pubspec.yaml Version
        run: |
          VERSION="${{ steps.extract-version.outputs.version }}"
          if [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            sed -i "s/^version: .*/version: $VERSION/" gardendless/pubspec.yaml
          fi

      - name: Commit Changes
        run: |
          cd gardendless
          VERSION="${{ steps.extract-version.outputs.version }}"
          
          # 提交代码变更
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          if git diff --quiet pubspec.yaml; then
            echo "No changes in pubspec.yaml, skipping commit"
          else
            git add pubspec.yaml
            git commit -m "Auto update to $VERSION"
          fi

          # 创建并推送标签
          if [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            git tag -a v$VERSION -m "Release $VERSION"
            git push origin main --follow-tags
            git push origin refs/tags/v$VERSION
            echo "TAG_NAME=v$VERSION" >> $GITHUB_ENV
          else
            COMMIT_SHORT=$(git rev-parse --short HEAD)
            git tag -a commit-$COMMIT_SHORT -m "Commit-based release"
            git push origin main --follow-tags
            git push origin refs/tags/commit-$COMMIT_SHORT
            echo "TAG_NAME=commit-$COMMIT_SHORT" >> $GITHUB_ENV
          fi

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build APK
        run: |
          cd gardendless
          flutter pub get
          flutter build apk --release

      - name: Upload APK Release
        uses: softprops/action-gh-release@v1
        with:
          files: gardendless/build/app/outputs/flutter-apk/app-release.apk
          tag_name: ${{ env.TAG_NAME }}  # 使用创建的标签
          name: "Build ${{ env.TAG_NAME }}"
          body: "Auto-generated release for version ${{ env.TAG_NAME }}"
          token: ${{ secrets.GH_TOKEN }}

      - name: Update Last Commit
        run: |
          echo "${{ steps.get-test-pvz2-commit.outputs.commit_sha }}" > gardendless/assets/last_commit.txt
          cd gardendless
          git add assets/last_commit.txt
          git commit -m "Update last processed commit"
          git push